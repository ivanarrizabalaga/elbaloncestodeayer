name: Backup

# Weekly database backup to a private R2 bucket (docs/infrastructure.md, «Backups»).
# The dump never touches the repo or the run's artifacts: this repository is public.
on:
  schedule:
    - cron: "0 3 * * 0" # Sundays, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dump the production database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: sh scripts/backup.sh dump

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 does not need the newer default checksums of the AWS CLI.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BACKUPS_BUCKET: ${{ secrets.R2_BACKUPS_BUCKET }}
        run: |
          name="db-$(date -u +%Y-%m-%d).tar.gz"
          tar -czf "$name" -C dump .
          aws s3 cp "$name" "s3://$R2_BACKUPS_BUCKET/$name" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo "Uploaded $name ($(du -h "$name" | cut -f1))"
