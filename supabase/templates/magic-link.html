<!doctype html>
<html lang="es">
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #0e0e0e;
      color: #f2f2f2;
      font-family: Inter, Arial, sans-serif;
    "
  >
    <div style="max-width: 480px; margin: 0 auto">
      <p
        style="
          margin: 0 0 24px;
          font-size: 14px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #ff7a1a;
          font-weight: 700;
        "
      >
        El baloncesto de ayer
      </p>
      <h1 style="margin: 0 0 16px; font-size: 24px">Tu enlace para entrar</h1>
      <p style="margin: 0 0 24px; line-height: 1.6; color: #a6a6a6">
        Pulsa el botón para entrar. El enlace caduca en una hora y solo sirve
        una vez.
      </p>
      <p style="margin: 0 0 32px">
        <a
          href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
          style="
            display: inline-block;
            padding: 14px 28px;
            border-radius: 999px;
            background: #ff7a1a;
            color: #0e0e0e;
            font-weight: 700;
            text-decoration: none;
          "
          >Entrar</a
        >
      </p>
      <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #a6a6a6">
        Si no has pedido este enlace, ignora este correo: nadie podrá entrar sin
        él.
      </p>
    </div>
  </body>
</html>
